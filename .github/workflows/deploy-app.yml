name: Deploy App (Cloudflare Pages)

# エディタ(リポジトリ直下)を Cloudflare Pages のダイレクトアップロード用プロジェクトへ配信する。
# サイト(site/)だけの変更では動かさない。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  # Cloudflare Pages のプロジェクト名(ダイレクトアップロード形式で作成したもの)
  PAGES_PROJECT: storift

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
