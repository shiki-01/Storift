[package]
name = "storift"
version = "0.1.0"
description = "Storift デスクトップ版"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "storift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "net", "rt"] }
which = "7"
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
