[package]
name = "storift"
version = "0.7.0"
description = "Storift デスクトップ版"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "storift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "net", "rt"] }
which = "7"
getrandom = "0.3"

# 2 つ目のインスタンスの起動を 1 つ目へ引き渡す(Windows / Linux は deep link で別のプロセスが起動するため)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# API キーの保管(OS のキーチェーン)。Linux は libdbus 等への依存を避けるため使わない(secrets.rs)
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
